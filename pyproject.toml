[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "soundcloud-track-id"
version = "0.1.0"
description = "Remote MCP server that identifies the song playing in a SoundCloud track or DJ set."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "mcp==2.3.0",
    "shazamio==0.8.1",
    "yt-dlp==2026.8.19",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
track_id = ["card.html"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["track_id"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"
